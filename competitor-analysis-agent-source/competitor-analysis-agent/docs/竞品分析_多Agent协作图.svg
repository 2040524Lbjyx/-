  <text x="540" y="314" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="400" fill="#993C1D">报告 Agent</text>
  <text x="540" y="332" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="400" fill="#993C1D">渲染输出</text>

  <line x1="170" y1="308" x2="183" y2="308" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="315" y1="308" x2="328" y2="308" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="460" y1="308" x2="473" y2="308" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="176" y="302" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="400" fill="#3B6D11">写入</text>
  <text x="322" y="302" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="400" fill="#3B6D11">检索 RAG</text>
  <text x="467" y="302" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" font-weight="400" fill="#3B6D11">分析</text>

  <path d="M540,346 C540,392 510,412 472,420" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="210" y="420" width="260" height="54" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="442" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">结构化竞品分析报告</text>
  <text x="340" y="461" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" font-weight="400" fill="#185FA5">→ 分析结果 / 历史记录 Tab</text>

  <line x1="60" y1="500" x2="92" y2="500" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="98" y="504" font-family="sans-serif" font-size="11" font-weight="400" fill="#2C2C2A">数据流</text>
  <line x1="170" y1="500" x2="202" y2="500" stroke="#185FA5" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="208" y="504" font-family="sans-serif" font-size="11" font-weight="400" fill="#2C2C2A">编排调度</text>

  <text x="340" y="525" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="400" fill="#5F5E5A">LLM：OpenAI / DeepSeek 兼容 · 抽取低温 0.1 · 生成 0.7</text>
</svg>