version: '3.8'

services:
  # 主应用
  app:
    build: .
    container_name: competitor-analysis-agent
    ports:
      - "8000:8000"  # API端口
      - "8501:8501"  # Streamlit端口
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHROMA_PERSIST_DIRECTORY=/app/data/chromadb
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
      - chromadb
    networks:
      - agent-network
    restart: unless-stopped
  
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: competitor-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: competitor_analysis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agent-network
    restart: unless-stopped
  
  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: competitor-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agent-network
    restart: unless-stopped
  
  # ChromaDB向量数据库
  chromadb:
    image: chromadb/chroma:latest
    container_name: competitor-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - agent-network
    restart: unless-stopped
  
  # (可选) Adminer - 数据库管理界面
  adminer:
    image: adminer:latest
    container_name: competitor-adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - agent-network
    restart: unless-stopped

# 数据卷
volumes:
  postgres_data:
  redis_data:
  chroma_data:

# 网络
networks:
  agent-network:
    driver: bridge
